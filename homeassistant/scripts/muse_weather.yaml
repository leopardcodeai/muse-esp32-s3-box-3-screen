# script.muse_weather: today's weather on the box, with low and high and when rain starts.
# Call it from the assistant or an automation; it needs a weather entity with forecasts.
alias: "Muse weather"
mode: single
sequence:
  - action: weather.get_forecasts
    target:
      entity_id: weather.home
    data:
      type: hourly
    response_variable: hours
  - variables:
      fc: "{{ hours['weather.home'].forecast }}"
      rain: >-
        {% set ns = namespace(at='') %}
        {% for h in fc[:12] if ns.at == '' and (h.precipitation_probability | default(0)) > 50 %}
          {% set ns.at = as_datetime(h.datetime).strftime('%H:%M') %}
        {% endfor %}
        {{ ns.at }}
  - action: esphome.muse_box_muse_show_weather
    data:
      condition: "{{ states('weather.home') }}"
      temperature: "{{ state_attr('weather.home', 'temperature') }}"
      message: >-
        Tief {{ fc | map(attribute='temperature') | min }}°, hoch {{ fc | map(attribute='temperature') | max }}°.
        {% if rain %}Regen ab {{ rain }} Uhr.{% else %}Heute kein Regen in Sicht.{% endif %}
