esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# =============================================================================
# I2C
# =============================================================================

i2c:
  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: true
  # MUSE 3.2 (07.10.2026): the bus of the box's own audio chips (ES7210 microphones,
  # ES8311 speaker) and touch screen. It was missing, so neither chip was ever set up:
  # the assist satellite stayed idle or unavailable for ten days, never listening.
  - id: bus_a
    sda: GPIO8
    scl: GPIO18
    scan: true

# =============================================================================
# SPI
