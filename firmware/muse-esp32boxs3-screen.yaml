
# Muse ESP32BoxS3 Screen: the ESP32-S3-BOX-3 as the face, voice and ears of an AI assistant.
# Everything that differs from house to house is a substitution or a secret; the rest is
# the firmware. Docs: ../README.md, ../docs/. Build: esphome compile firmware/muse-esp32boxs3-screen.yaml
substitutions:
  name: muse-esp32boxs3-screen                 # device name, also the mDNS name: muse-esp32boxs3-screen.local
  friendly_name: Muse ESP32BoxS3 Screen
  # Home Assistant as the box reaches it (pictures, the doorbell file, routes' "home")
  ha_url: "http://homeassistant.local:8123"
  # The AHT20 on the sensor dock sits beside the warm display; on one box it read
  # 8.34 K too warm over 48 h of comparison. "0" shows the raw value.
  temperature_offset: "-8.34"
  # Map tiles for route cards: any {z}/{x}/{y} server with 256 px PNG tiles ({s} becomes
  # a, b or c). The default is OpenStreetMap's own server, which allows apps that send a
  # distinct user agent and stay light (docs/PRIVACY.md); the card shows the attribution
  # the tiles require. Your own tile server or a provider with a key goes here too.
  map_tiles: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  # The still picture of your doorbell (or any camera) under Home Assistant's www folder,
  # shown by muse_show_image with an empty url.
  doorbell_image: "/local/doorbell_latest.jpg"
  # "" draws the placeholder figure from figure/; "muse_" the animations that
  # tools/make_muse_assets.py cuts out of the Muse app as figure/muse_*.png (Meta's
  # artwork: .gitignore keeps them out of the repository, never commit them).
  figure_prefix: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  # MUSE: text cleaning, icons, paging and soft shapes for the display lambda; the scene
  # language of muse_draw (muse_scene.h, icon names in the generated muse_icons.h).
  includes:
    - muse_icons.h
    - muse_scene.h
    - muse_fit.h
    - muse.h
    - muse_media.h
    # GIF frames for muse_media.h: AnimatedGIF 2.2.3 (Apache 2.0) as a copy with a small
    # ESP-IDF fix (muse_gif/README.md); the JPEG and PNG decoders come with online_image.
    - muse_gif
  on_boot:
    - priority: 600
      then:
        - lambda: 'muse::media::tile_template() = "${map_tiles}";'
        - light.turn_on:
            id: led
            brightness: 100%
        - component.update: s3_box_lcd
        - micro_wake_word.start
    # MUSE 3.2: both audio chips fail to set up at boot although they answer on the bus;
    # once everything runs they come up (script audio_init).
    - priority: -100
      then:
        - delay: 3s
        - script.execute: audio_init
  project:
    name: "leopardcodeai.muse_esp32boxs3_screen"
    version: "4.2.0"

# Optional parts live in packages/. Uncomment a line to take one in: the Samsung TV
# remote through the dock's IR (not needed for anything else the box does).
# packages:
#   samsung_tv_ir: !include packages/samsung_tv_ir.yaml

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    # MUSE 3.4: TLS 1.3 needs the peer certificate kept after the handshake, which ESPHome
    # drops by default to save about 4 KB of heap per connection.
    advanced:
      disable_mbedtls_peer_cert: false
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # MUSE 3.4: routing.openstreetmap.de speaks TLS 1.3 only; with 1.2 alone the handshake
      # ended in a fatal alert (-0x7780, 07.10.2026).
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      # MUSE 3.5: mbedTLS takes its buffers (about 40 KB per handshake) from PSRAM. From
      # internal RAM, 82 KB free at rest, the display's DMA transfer found no memory during a
      # handshake ("spi: Transmit failed - err 101", 07.10.2026).
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_encryption_key
  actions:
  # --- MUSE (06.10.2026, v3 07.10.2026): the assistant Muse drives this display ---
  # Called from Home Assistant, for example:
  #   action: esphome.muse_esp32boxs3_screen_muse_show_text
  #   data: {title: "Erinnerung", message: "Sam kommt um 18:30."}
  # Whatever Muse shows stays a while (text, value and events 20 s, confetti 30 s,
  # weather 60 s, photos 90 s; long texts page through and stay longer; a scene as long
  # as it says, 20 s by default), then the status animation returns. The fonts hold no
  # emoji: weather emojis become icons, every other emoji is dropped (muse.h).
    - action: muse_set_status
      variables:
        status: string
      then:
        - lambda: |-
            // English values; the German ones Muse proposed first are accepted too.
            id(muse_state) = muse::parse_status(status);
            // The default label of the status. A label of one's own comes only from
            // muse_set_status_text.
            id(muse_status_text) = "";
        - script.execute: muse_brightness
    # Same as muse_set_status, plus a label for the status pill instead of its default
    # text. A second action, because Home Assistant makes every declared argument
    # mandatory: an extra argument on muse_set_status would break every call that sends
    # only `status` (measured 07.10.2026: HTTP 400 for a missing argument). The argument
    # is called `label`: ESPHome reserves `text` as a name (RESERVED_IDS). An empty label
    # gives the default text. The label is cut to one line that fits the pill, with "…"
    # at the end, and goes when the status changes.
    - action: muse_set_status_text
      variables:
        status: string
        label: string
      then:
        - lambda: |-
            id(muse_state) = muse::parse_status(status);
            id(muse_status_text) = muse::single_line(muse::clean(label, id(m_status)).text);
            id(muse_status_text_state) = id(muse_state);
            ESP_LOGI("muse", "status %d, label \"%s\"", id(muse_state), id(muse_status_text).c_str());
        - script.execute: muse_brightness
    # MUSE 3.2: the cards below wait in line while another card is on screen; a tap on
    # the screen shows the next one (muse.h "queue", script muse_next). A card with the
    # title of the one on screen replaces it at once; the doorbell goes first.
    - action: muse_show_text
      variables:
        title: string
        message: string
      then:
        - lambda: |-
            auto t = muse::clean(title, id(m_title));
            auto b = muse::clean(message, id(m_body));
            muse::Card c;
            c.mode = 1;
            c.title = t.text;
            c.body = b.text;
            c.icon = b.icon != muse::W_NONE ? b.icon : t.icon;
            c.ms = 20000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "text card waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    - action: muse_show_value
      variables:
        label: string
        value: string
        unit: string
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 2;
            c.label = muse::clean(label, id(m_label)).text;
            c.value = muse::clean(value, id(m_value)).text;
            c.unit = muse::clean(unit, id(m_unit)).text;
            c.ms = 20000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "value card waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    - action: muse_celebrate
      variables:
        title: string
        message: string
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 3;
            c.title = muse::clean(title, id(m_title)).text;
            c.body = muse::clean(message, id(m_body)).text;
            c.ms = 30000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "celebration waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    - action: muse_show_weather
      variables:
        condition: string
        temperature: string
        message: string
      then:
        - lambda: |-
            // condition: Home Assistant's weather state (sunny, rainy, ...) or a
            // word such as "Regen"; temperature: "14", "14,5 °C" or empty.
            const auto *w = muse::condition(condition);
            auto b = muse::clean(message, id(m_body));
            muse::Card c;
            c.mode = 4;
            c.icon = w != nullptr ? w->icon : (b.icon != muse::W_NONE ? b.icon : (int) muse::W_CLOUDY);
            c.label = w != nullptr ? std::string(w->label) : muse::clean(condition, id(m_label)).text;
            c.value = muse::temperature(temperature);
            c.body = b.text;
            c.ms = 60000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "weather card waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    - action: muse_show_event
      variables:
        icon: string
        title: string
        message: string
      then:
        - lambda: |-
            // icon: klingel, garage, garage_zu, rollladen_runter, rollladen_hoch,
            // mail, kalender, muell, tv_an, tv_aus, zuhause, briefkasten, tuer,
            // nachrichten, licht, solar, timer, erledigt, info (English names too).
            muse::Card c;
            c.mode = 6;
            c.event = icon;
            c.title = muse::clean(title, id(m_title)).text;
            c.body = muse::clean(message, id(m_body)).text;
            c.ms = 20000;
            const int showing = id(muse_mode);
            const bool urgent = muse::urgent_event(c.event);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, urgent), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "event card waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    - action: muse_show_image
      variables:
        title: string
        message: string
        url: string
      then:
        - lambda: |-
            // A JPEG (baseline) or PNG, scaled to fit 300x168. Without a URL, or when the
            // download fails, title and message show as an event card; with the icon of
            // the card it replaces, so a failed door photo still shows the doorbell.
            muse::Card c;
            c.mode = url.empty() ? 6 : 5;
            c.title = muse::clean(title, id(m_title)).text;
            c.body = muse::clean(message, id(m_body)).text;
            c.url = url.str();
            c.ms = 90000;
            const auto &now_on = muse::current_card();
            c.event = (!c.title.empty() && now_on.title == c.title && !now_on.event.empty()) ? now_on.event : "info";
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "photo waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    # A live view (MUSE 3.4): the picture at `url` is fetched again and again for `seconds`
    # (5 to 120), as fast as the box decodes it. For a camera of Home Assistant use
    # camera_proxy with its token and &width=300&height=168: two to five pictures a second.
    - action: muse_show_live
      variables:
        title: string
        url: string
        seconds: int
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 5;
            c.title = muse::clean(title, id(m_title)).text;
            c.body = "Live";
            c.url = url.str();
            c.event = "info";
            c.live_s = seconds < 5 ? 5 : seconds > 120 ? 120 : seconds;
            c.ms = c.live_s * 1000 + 3000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "live view waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    # A route on a map (MUSE 3.4): `from` and `to` as "lat,lon", as a place name (found
    # with OpenStreetMap's Nominatim) or "zuhause"; `mode` car, bike or foot (auto,
    # fahrrad, zu fuss too). The way comes from routing.openstreetmap.de, the map from
    # the tile server in `map_tiles` (OpenStreetMap by default), so both points leave the
    # house. Start green, destination red, distance and time below, the tiles' attribution
    # bottom right. Stays 60 s, waits in line like every card.
    - action: muse_show_route
      variables:
        title: string
        from: string
        to: string
        mode: string
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 9;
            c.title = muse::single_line(muse::clean(title, id(m_label)).text);
            c.from = from.str();
            c.to = to.str();
            const std::string m = muse::lower(muse::trim(mode.str()));
            c.profile = (m == "bike" || m == "fahrrad" || m == "rad" || m == "bicycle") ? "bike"
                        : (m == "foot" || m == "walk" || m == "zu fuss" || m == "zu fu\u00DF" || m == "laufen" ||
                           m == "gehen" || m == "fuss")
                            ? "foot"
                            : "car";
            c.event = "info";
            c.ms = 60000;
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "route waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    # The day's appointments (owner, 07.10.2026: "wenn calendar abgefragt oder was steht
    # heute an"): a calendar sheet with weekday and day, the title ("Heute" when empty) and
    # the count, the appointments below, four at a time, paging by themselves. `events`
    # holds one appointment per line: "09:00-10:00 Teammeeting @ office", "ganztägig
    # Urlaub", or "09:00 | Teammeeting | office". Stays 30 s, longer for more pages.
    - action: muse_show_agenda
      variables:
        title: string
        events: string
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 10;
            c.title = title.empty() ? std::string("Heute") : muse::single_line(muse::clean(title, id(m_title)).text);
            c.body = muse::clean(events, id(m_body)).text;
            const size_t pages = (muse::parse_agenda(c.body).size() + 3) / 4;
            c.ms = std::max<uint32_t>(30000, (uint32_t) pages * 8000 + 6000);
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "agenda waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    # A picture of Muse's own design: background and gradients, shapes, text in six sizes,
    # 264 icons, Muse's figure, particles, motion and frames, written in the scene
    # language of muse_scene.h (README "Scenes", the project history). It stays 20 s unless
    # the scene says `seconds N`; a scene replaces a scene on screen at once, so Muse can
    # show one after the other; an empty scene ends it. The response tells Muse what went
    # wrong, line by line: {"ok", "elements", "frames", "seconds", "skipped", "errors"}.
    - action: muse_draw
      variables:
        scene: string
      then:
        - lambda: |-
            // ESPHome hands string arguments over as StringRef; the parser wants a string.
            const std::string src = scene.str();
            auto &r = muse::scene_check();
            r = muse::scene::parse(src);
            for (const auto &e : r.errors) ESP_LOGW("muse", "scene %s", e.c_str());
            if (src.find_first_not_of(" \t\r\n") == std::string::npos) {
              if (id(muse_mode) == 7) id(muse_next).execute();
              ESP_LOGI("muse", "scene cleared");
            } else {
              muse::Card c;
              c.mode = 7;
              c.scene = src;
              c.ms = r.seconds * 1000;
              const int showing = id(muse_mode);
              const auto p = showing == 7 ? muse::REPLACE : muse::place(c, showing, false);
              if (muse::enqueue(c, p, showing)) id(muse_next).execute();
              ESP_LOGI("muse", "scene: %u bytes, %u elements, %u frames, %u s, %u skipped, %s",
                       (unsigned) src.size(), (unsigned) r.items.size(), (unsigned) r.frames.size(),
                       (unsigned) r.seconds, (unsigned) r.skipped, p == muse::WAIT ? "waits" : "on screen");
            }
        - api.respond:
            data: !lambda |-
              const auto &s = muse::scene_check();
              root["ok"] = s.errors.empty();
              root["elements"] = (int) s.items.size();
              root["frames"] = (int) s.frames.size();
              root["seconds"] = (int) s.seconds;
              root["skipped"] = (int) s.skipped;
              JsonArray errors = root["errors"].to<JsonArray>();
              for (const auto &e : s.errors) errors.add(e);
    # A yes/no question with two buttons (owner, 07.10.2026); it goes before every other
    # card. The action waits up to 25 s for a tap and answers {"answer", "question"}:
    # "yes", "no", or "pending" while the question is still on screen (it stays 2 min).
    # Every answer also lands in the sensor "Antwort" as "yes: <question>", "no: ..." or
    # "none: ..." when the question went unanswered. Empty labels give "Ja" and "Nein".
    - action: muse_ask
      variables:
        question: string
        yes_label: string
        no_label: string
      then:
        - lambda: |-
            std::vector<std::string> options = {
                yes_label.empty() ? "Ja" : muse::single_line(muse::clean(yes_label, id(m_unit)).text),
                no_label.empty() ? "Nein" : muse::single_line(muse::clean(no_label, id(m_unit)).text)};
            muse::ask_prepare(id(muse_answer), id(muse_mode), muse::clean(question, id(m_title)).text, options,
                              {"yes", "no"});
            muse::Card c;
            c.mode = 8;
            c.title = muse::question().text;
            c.ms = 120000;
            muse::enqueue(c, muse::NOW, id(muse_mode));
            id(muse_next).execute();
        - media_player.speaker.play_on_device_media_file:
            media_file: snd_ask
            announcement: true
        - wait_until:
            condition:
              lambda: 'return !muse::question().open;'
            timeout: 25s
        - api.respond:
            data: !lambda |-
              const auto &qs = muse::question();
              root["answer"] = qs.open ? "pending" : qs.answer;
              root["question"] = qs.text;
    # A question with two to four answers of Muse's choosing (MUSE 4.0): `options` one per
    # line. Waits like muse_ask and answers {"answer": the chosen text | "pending"}.
    - action: muse_choose
      variables:
        question: string
        options: string
      then:
        - lambda: |-
            std::vector<std::string> opts;
            const std::string all = muse::clean(options, id(m_unit)).text;
            size_t start = 0;
            while (start <= all.size() && opts.size() < 4) {
              size_t nl = all.find('\n', start);
              if (nl == std::string::npos) nl = all.size();
              const std::string line = muse::single_line(all.substr(start, nl - start));
              start = nl + 1;
              if (!line.empty()) opts.push_back(line);
            }
            if (opts.size() < 2) opts = {"Ja", "Nein"};
            muse::ask_prepare(id(muse_answer), id(muse_mode), muse::clean(question, id(m_title)).text, opts, opts);
            muse::Card c;
            c.mode = 8;
            c.title = muse::question().text;
            c.ms = 120000;
            muse::enqueue(c, muse::NOW, id(muse_mode));
            id(muse_next).execute();
        - media_player.speaker.play_on_device_media_file:
            media_file: snd_ask
            announcement: true
        - wait_until:
            condition:
              lambda: 'return !muse::question().open;'
            timeout: 25s
        - api.respond:
            data: !lambda |-
              const auto &qs = muse::question();
              root["answer"] = qs.open ? "pending" : qs.answer;
              root["question"] = qs.text;
    # Waits up to `seconds` (1 to 60) for the next answer a touch gives: a question button
    # or a `button` in a scene (muse_draw). Answers {"answered": bool, "answer": text}.
    - action: muse_wait_answer
      variables:
        seconds: int
      then:
        - lambda: |-
            id(answer_wait_from) = muse::answer_count();
            const int s = seconds < 1 ? 1 : seconds > 60 ? 60 : seconds;
            id(answer_wait_until) = millis() + (uint32_t) s * 1000;
        - while:
            condition:
              lambda: |-
                return muse::answer_count() == id(answer_wait_from) &&
                       (int32_t) (id(answer_wait_until) - millis()) > 0;
            then:
              - delay: 200ms
        - api.respond:
            data: !lambda |-
              const bool answered = muse::answer_count() != id(answer_wait_from);
              root["answered"] = answered;
              root["answer"] = answered ? muse::last_answer() : "";
    # A timer on the box (MUSE 4.0): `duration` as "5", "5 min", "1:30", "90 s" or
    # "1 h 20 min"; `label` names it ("Pizza"). The card shows the ring and the time, the
    # chime plays and a card says so when it ends. Timers set by voice through Home
    # Assistant appear the same way.
    - action: muse_show_timer
      variables:
        label: string
        duration: string
      then:
        - lambda: |-
            const uint32_t secs = muse::parse_duration(duration.str());
            muse::placed_now() = false;
            if (secs == 0 || secs > 24 * 3600) {
              ESP_LOGW("muse", "timer: '%s' is no duration", duration.c_str());
              return;
            }
            muse::TimerEntry e;
            e.local = true;
            e.id = "local-" + std::to_string(++id(muse_timer_serial));
            e.name = muse::single_line(muse::clean(label, id(m_label)).text);
            if (e.name.empty()) e.name = "Timer";
            e.total = secs;
            e.left = secs;
            e.end_ms = millis() + secs * 1000;
            muse::timers().push_back(e);
            muse::placed_now() = true;
            ESP_LOGI("muse", "timer %s: %u s", e.name.c_str(), (unsigned) secs);
        - if:
            condition:
              lambda: 'return muse::placed_now();'
            then:
              - script.execute: muse_timer_card
        - api.respond:
            data: !lambda |-
              root["ok"] = muse::placed_now();
              root["seconds"] = muse::placed_now() ? (int) muse::timers().back().total : 0;
              root["timers"] = (int) muse::timers().size();
    # Cancels the box's own timers: all with `label` empty, else those with that name.
    - action: muse_cancel_timer
      variables:
        label: string
      then:
        - lambda: |-
            auto &t = muse::timers();
            const std::string want = muse::lower(muse::trim(label.str()));
            const size_t before = t.size();
            t.erase(std::remove_if(t.begin(), t.end(),
                                   [&](const muse::TimerEntry &e) {
                                     return e.local && (want.empty() || muse::lower(e.name) == want);
                                   }),
                    t.end());
            muse::placed_now() = before != t.size();
            ESP_LOGI("muse", "timers cancelled: %u", (unsigned) (before - t.size()));
        - api.respond:
            data: !lambda |-
              root["cancelled"] = muse::placed_now();
              root["timers"] = (int) muse::timers().size();
    # A list (MUSE 4.0): shopping, tasks, anything with ticks. `items` one per line,
    # "[x] Milch" done, "[ ] Brot" or "- Brot" open. Five per page, pages turn by themselves.
    - action: muse_show_list
      variables:
        title: string
        items: string
      then:
        - lambda: |-
            muse::Card c;
            c.mode = 13;
            c.title = title.empty() ? std::string("Liste") : muse::single_line(muse::clean(title, id(m_title)).text);
            c.body = muse::clean(items, id(m_body)).text;
            const size_t pages = (muse::parse_list(c.body).size() + 4) / 5;
            c.ms = std::max<uint32_t>(30000, (uint32_t) pages * 8000 + 6000);
            const int showing = id(muse_mode);
            muse::placed_now() = muse::enqueue(c, muse::place(c, showing, false), showing);
            if (muse::placed_now()) id(muse_next).execute();
            else ESP_LOGI("muse", "list waits, %u in line", (unsigned) muse::queue().size());
        - api.respond:
            data: !lambda |-
              root["on_screen"] = muse::placed_now();
              root["waiting"] = (int) muse::queue().size();
    # Every card gone, the line emptied, the status back (MUSE 4.0). An open question
    # counts as unanswered.
    - action: muse_clear
      then:
        - lambda: |-
            muse::placed_now() = id(muse_mode) != 0 || !muse::queue().empty();
            ESP_LOGI("muse", "clear: %u waiting dropped", (unsigned) muse::queue().size());
            muse::queue().clear();
        - script.execute: muse_next
        - api.respond:
            data: !lambda |-
              root["cleared"] = muse::placed_now();
    # What the box shows and knows right now (MUSE 4.0), for Muse to decide what to send.
    - action: muse_get_state
      then:
        - api.respond:
            data: !lambda |-
              static const char *const MODES[] = {"status", "text", "value", "celebration", "weather", "photo",
                                                  "event", "scene", "question", "route", "agenda", "timer",
                                                  "info", "list"};
              const int mode = id(muse_mode);
              root["mode"] = mode >= 0 && mode <= 13 ? MODES[mode] : "?";
              root["title"] = id(muse_title);
              root["waiting"] = (int) muse::queue().size();
              root["history"] = (int) muse::history().size();
              root["question_open"] = muse::question().open;
              root["last_answer"] = muse::last_answer();
              root["status"] = id(muse_state);
              root["listening"] = id(muse_state) == 1;
              root["muted"] = id(mute_switch).state;
              root["presence"] = id(radar_presence).state;
              root["battery_pct"] = (int) id(battery_pct).state;
              root["wifi_dbm"] = (int) id(wifi_rssi).state;
              root["timers"] = (int) muse::timers().size();
              root["volume"] = (int) lroundf(id(muse_player)->volume * 100);
              root["display_off"] = id(muse_screen_off);
              root["version"] = "4.2.0";
    # Hardware check: asks every chip of the box and of the sensor dock
    # who it is, reads the pins of buttons, touch and radar, the battery voltage and how
    # the audio chips came up. Read only. The answer lists every reading with what a
    # healthy box shows in brackets; the same lines go to the log ("hw: ...").
    - action: muse_hw_check
      then:
        - lambda: |-
            auto &rep = muse::hw_report();
            rep.items.clear();
            auto *a = id(bus_a);
            auto *b = id(bus_b);
            rep.add("es8311 speaker chip id (83 11)", muse::reg_read(a, 0x18, 0xFD, false, 2));
            rep.add("es7210 microphone chip id (72 10)", muse::reg_read(a, 0x40, 0x3D, false, 2));
            rep.add("touch gt911 at 0x5D (39 31 31)", muse::reg_read(a, 0x5D, 0x8140, true, 3));
            rep.add("touch gt911 at 0x14 (39 31 31)", muse::reg_read(a, 0x14, 0x8140, true, 3));
            rep.add("imu icm-42607 at 0x68, who_am_i (60)", muse::reg_read(a, 0x68, 0x75, false, 1));
            rep.add("imu icm-42607 at 0x69, who_am_i (60)", muse::reg_read(a, 0x69, 0x75, false, 1));
            rep.add("dock chip 0x28, registers 00-07", muse::reg_read(b, 0x28, 0x00, false, 8));
            rep.add("dock aht20 0x38, status (18 or 1C)", muse::reg_read(b, 0x38, 0x71, false, 1));
            rep.add("audio chips ready (script audio_init)",
                    std::string(id(audio_ok) ? "yes" : "no") + ", tries " + std::to_string(id(audio_tries)));
            rep.add("touch gt911 set up", id(box_touch)->is_failed() ? "failed" : "yes");
            rep.add("cards waiting", std::to_string(muse::queue().size()));
            rep.add("internal RAM free, largest block",
                    std::to_string(heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024) + " KB, " +
                        std::to_string(heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024) + " KB");
            rep.add("PSRAM free", std::to_string(heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024) + " KB");
            rep.add("es8311 failed at boot", id(es8311_dac)->is_failed() ? "yes" : "no");
            rep.add("es7210 failed at boot", id(es7210_adc)->is_failed() ? "yes" : "no");
            rep.add("es8311 register 00 (80)", muse::reg_read(a, 0x18, 0x00, false, 1));
            rep.add("es7210 register 40 (C3)", muse::reg_read(a, 0x40, 0x40, false, 1));
            rep.add("gpio0 top left button (1 up, 0 pressed)", std::to_string(gpio_get_level(GPIO_NUM_0)));
            rep.add("gpio1 mute switch", std::to_string(gpio_get_level(GPIO_NUM_1)));
            rep.add("gpio3 touch interrupt", std::to_string(gpio_get_level(GPIO_NUM_3)));
            rep.add("gpio21 radar, raw", std::to_string(gpio_get_level(GPIO_NUM_21)));
            char v[24];
            snprintf(v, sizeof(v), "%.2f V", id(battery_voltage)->state);
            rep.add("battery voltage (3.0 to 4.2)", v);
            for (const auto &kv : rep.items) ESP_LOGI("muse", "hw: %s = %s", kv.first.c_str(), kv.second.c_str());
        - api.respond:
            data: !lambda |-
              for (const auto &kv : muse::hw_report().items) root[kv.first] = kv.second;
  # --- end MUSE actions ---

globals:
  # MUSE: 0 ready, 1 listening, 2 thinking, 3 speaking, 4 error, 5 quiet, 6 greeting
  - id: muse_state
    type: int
    restore_value: false
    initial_value: '0'
  # MUSE: 0 status, 1 text or conversation, 2 value, 3 celebration, 4 weather,
  # 5 photo, 6 event, 7 scene (muse_draw)
  - id: muse_mode
    type: int
    restore_value: false
    initial_value: '0'
  - id: muse_title
    type: std::string
    restore_value: false
  - id: muse_body
    type: std::string
    restore_value: false
  - id: muse_label
    type: std::string
    restore_value: false
  - id: muse_value
    type: std::string
    restore_value: false
  - id: muse_unit
    type: std::string
    restore_value: false
  # weather icon of a text or weather card (muse::Weather), -1 for none
  - id: muse_icon
    type: int
    restore_value: false
    initial_value: '-1'
  # icon name of an event card (muse::event)
  - id: muse_event
    type: std::string
    restore_value: false
  # the text card is a voice conversation: the question on top, the answer below
  - id: muse_conv
    type: bool
    restore_value: false
    initial_value: 'false'
  # counts up with every new content; the display lambda re-wraps text on change
  - id: muse_version
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() when the content appeared, and when the status returns
  - id: muse_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: muse_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # photo download: 0 none, 1 loading, 2 ready, 3 failed
  - id: muse_photo_state
    type: int
    restore_value: false
    initial_value: '0'
  # backlight level last set by the script muse_brightness
  - id: muse_level
    type: float
    restore_value: false
    initial_value: '0.0'
  # label of the status pill set by muse_set_status_text, and the status it belongs to;
  # it is shown only while that status stays (the display lambda drops it otherwise)
  - id: muse_status_text
    type: std::string
    restore_value: false
  - id: muse_status_text_state
    type: int
    restore_value: false
    initial_value: '-1'
  # the top left button switched the display light off (script muse_brightness)
  - id: muse_screen_off
    type: bool
    restore_value: false
    initial_value: 'false'
  # Muse is being cuddled (a tap on the ready screen) until this millis()
  - id: muse_cuddle_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # where and when the finger came down (touchscreen)
  - id: touch_x
    type: int
    restore_value: false
    initial_value: '0'
  - id: touch_y
    type: int
    restore_value: false
    initial_value: '0'
  - id: touch_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # what the last touch asks for: 0 nothing, 4 listen (voice assistant)
  - id: touch_action
    type: int
    restore_value: false
    initial_value: '0'
  # where the finger was last seen (touchscreen on_update), for swipes
  - id: last_x
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_y
    type: int
    restore_value: false
    initial_value: '0'
  # muse_wait_answer: the answer count it started from, and its deadline
  - id: answer_wait_from
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: answer_wait_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() when the radar last stopped seeing someone (night calm, switch night_calm)
  - id: radar_off_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # the box's own timers get ids local-1, local-2, ...; the name of the one that ended last
  - id: muse_timer_serial
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: muse_timer_name
    type: std::string
    restore_value: false
  # the audio chips answer right after script audio_init, and how many tries it took
  - id: audio_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: audio_tries
    type: int
    restore_value: false
    initial_value: '0'

ota:
  - platform: esphome
    # Uploads use the same key as the API; a separate OTA password would cost flash.
    encryption:
      key: !secret api_encryption_key

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    text_sensor: WARN
    component: ERROR
    # MUSE v3: online_image logs the whole photo URL at DEBUG, and the garage
    # URL carries the camera's access token; http_request warns on every photo
    # that it found no cache headers.
    online_image: INFO
    http_request: ERROR

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP by default. For a fixed address add manual_ip with static_ip, gateway, subnet
  # AND dns1: without dns1 the box resolves no host name and every picture from the
  # web fails ("couldn't get hostname"), a lesson of 07.10.2026.
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# =============================================================================
# BLUETOOTH PROXY
