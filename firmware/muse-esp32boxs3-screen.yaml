spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

# =============================================================================
# FONTS
# =============================================================================
# MUSE v3 (07.10.2026): Inter, a plain screen typeface (SIL Open Font Licence),
# replaces Nunito, which looked soft and grey at these sizes. Every print passes
# the colour behind the text (muse.h explains why). The PV, weather, house,
# media and system pages are gone, and with them the Consolas fonts and the
# values they fetched from Home Assistant: the box shows only Muse (owner,
# 06.10.2026). The Muse app's own typeface (Optimistic) may not be altered,
# so it is not used.

font:
  - file: "gfonts://Inter@800"
    id: m_brand
    size: 19
    bpp: 4
    glyphs: "Muse"
  - file: "gfonts://Inter@600"
    id: m_clock
    size: 17
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Inter@600"
    id: m_status
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@700"
    id: m_title
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@500"
    id: m_body
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@500"
    id: m_small
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@600"
    id: m_label
    size: 17
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Values, and the largest scene text (xxl): letters, digits and a little punctuation.
  - file: "gfonts://Inter@700"
    id: m_value
    size: 54
    bpp: 4
    glyphs: "0123456789,.:-+%°/ abcdefghijklmnopqrstuvwxyzäöüßABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ€!?'&()"
  - file: "gfonts://Inter@600"
    id: m_unit
    size: 24
    bpp: 4
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Headlines of a scene (xl, 36 px). ASCII, German and common accents instead of all of
  # GF_Latin_Core, which would cost about three times the flash at this size.
  - file: "gfonts://Inter@700"
    id: m_head
    size: 36
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~äöüÄÖÜß€°„“”‘’–—…•·àáâéèêëíìîïóòôúùûçñÀÁÉÈÓÚÇÑ"
  # Icons: Material Design Icons 7.4.47 (Apache 2.0). The glyph list is generated with the
  # name table muse_icons.h by make_muse_icon_table.py, and holds the icons of muse::event
  # (event cards) as well as every icon a scene may name.
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: m_icons
    size: 46
    bpp: 4
    glyphs: !include muse_icon_glyphs.yaml
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: m_icons_s
    size: 24
    bpp: 4
    glyphs: !include muse_icon_glyphs.yaml
  # Status bar (MUSE 3.2): the Wi-Fi fan in five strengths and off, the crossed-out microphone.
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: m_status_icons
    size: 18
    bpp: 4
    glyphs: ["\U000F092F", "\U000F091F", "\U000F0922", "\U000F0925", "\U000F0928", "\U000F092E", "\U000F036D"]

sensor:
  - platform: aht10
    id: dock_climate
    i2c_id: bus_b
    variant: AHT20
    # The AHT20 shares the board with the ESP32-S3 and the always-on display, so it
    # reads too warm; `temperature_offset` (substitutions) corrects it. 60 s instead
    # of 10 s on purpose: reading less often takes real heat away, the offset only
    # calculates. Compare against a reference thermometer after the first flash.
    update_interval: 60s
    temperature:
      name: "Temperature"
      id: box3_temperatur
      filters:
        - offset: ${temperature_offset}
    humidity:
      name: "Humidity"
      id: box3_feuchte
      filters:
        # The sensor measures relative humidity at its own, too warm chip. The vapour
        # pressure is the same as in the room; only the relative humidity falls when
        # air gets warmer. So it is recalculated for the corrected temperature with
        # the Magnus formula; a fixed addition would be wrong at every other temperature.
        - lambda: |-
            float t_room = id(box3_temperatur).state;
            if (isnan(t_room) || isnan(x)) return x;
            float t_chip = t_room - (${temperature_offset});
            float p_chip = 6.112f * expf(17.62f * t_chip / (243.12f + t_chip));
            float p_room = 6.112f * expf(17.62f * t_room / (243.12f + t_room));
            float rh = x * p_chip / p_room;
            return rh > 100.0f ? 100.0f : (rh < 0.0f ? 0.0f : rh);

  - platform: adc
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  # MUSE 3.4: "zuhause" in a route (muse_show_route) means zone.home.
  - platform: homeassistant
    id: home_latitude
    entity_id: zone.home
    attribute: latitude
    internal: true
    on_value:
      - lambda: 'muse::media::home_lat() = x;'
  - platform: homeassistant
    id: home_longitude
    entity_id: zone.home
    attribute: longitude
    internal: true
    on_value:
      - lambda: 'muse::media::home_lon() = x;'

  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: copy
    id: battery_pct
    source_id: battery_voltage
    name: "Battery"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100

text_sensor:
  # MUSE 3.2: the answer to Muse's last yes/no question (muse_ask): "yes: <question>",
  # "no: ..." or "none: ..." when it went unanswered.
  - platform: template
    id: muse_answer
    name: "Answer"
    icon: mdi:gesture-tap-button
  # MUSE: sunrise and sunset for the backlight schedule (script muse_brightness).
  - platform: homeassistant
    id: ha_sun
    entity_id: sun.sun
    internal: true
    on_value:
      - script.execute: muse_brightness

binary_sensor:
  # MUSE 3.2 (07.10.2026): the radar raises GPIO21 for each movement it sees, for 1 to 7 s:
  # 1,423 changes and 696 times "on" in 24 h, and Muse waved at every one of them.
  # Presence now holds 30 s after the last movement, Muse waves once when someone
  # arrives, and a dot left of the clock shows that the radar sees someone.
  - platform: gpio
    id: radar_presence
    pin: GPIO21
    name: "Presence"
    device_class: "occupancy"
    filters:
      - delayed_off: 30s
    on_press:
      - logger.log:
          tag: muse
          level: INFO
          format: "radar: someone is there"
      - script.execute: muse_greet
      - script.execute: muse_brightness
    on_release:
      - lambda: 'id(radar_off_since) = millis();'
      - logger.log:
          tag: muse
          level: INFO
          format: "radar: nobody for 30 s"
  # MUSE 3.2: the buttons on top. Mute (GPIO1) cuts the microphones in hardware and
  # reports it here; top left ("light/boot", GPIO0) switches the display light; bottom
  # left switches the power in hardware, the firmware cannot see it.
  - platform: gpio
    id: mute_switch
    name: "Mute Switch"
    pin:
      number: GPIO1
      inverted: true
    on_press:
      - logger.log:
          tag: muse
          level: INFO
          format: "mute switch: microphones off"
    on_release:
      - logger.log:
          tag: muse
          level: INFO
          format: "mute switch: microphones on"
  - platform: gpio
    id: top_button
    name: "Top Left Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    on_click:
      - min_length: 30ms
        max_length: 1500ms
        then:
          - lambda: |-
              id(muse_screen_off) = !id(muse_screen_off);
              ESP_LOGI("muse", "top left button: display light %s", id(muse_screen_off) ? "off" : "on");
          - script.execute: muse_brightness

# =============================================================================
# DISPLAY
# =============================================================================
# The figure: figure/*.png, 160 x 160 animated PNGs plus a 72 x 72 avatar. The repo
# ships a neutral placeholder character (tools/make_placeholder_figure.py). With the
# Muse app installed, tools/make_muse_assets.py cuts Muse's own animations into the
# same files; those are Meta's artwork and must never be committed (tools/check_private.py
# refuses). The page background 243,243,243 is the colour every frame fades into.
# MUSE v3 (07.10.2026): weather icons from Meteocons (MIT), built by
# make_muse_icons.py into icons/ (committed, licence beside them). Their order
# is muse::Weather.
image:
  - platform: file
    file: "figure/${figure_prefix}avatar.png"
    id: muse_avatar
    type: RGB565
  - platform: animation
    file: "figure/${figure_prefix}idle.png"
    id: muse_idle
    type: RGB565
  - platform: animation
    file: "figure/${figure_prefix}working.png"
    id: muse_working
    type: RGB565
  - platform: animation
    file: "figure/${figure_prefix}wave.png"
    id: muse_wave
    type: RGB565
  - platform: animation
    file: "figure/${figure_prefix}making.png"
    id: muse_making
    type: RGB565
  - platform: animation
    file: "figure/${figure_prefix}confetti.png"
    id: muse_confetti
    type: RGB565
  - platform: file
    file: "icons/wx72_clear_day.png"
    id: wx72_clear_day
    type: RGB565
  - platform: file
    file: "icons/wx72_clear_night.png"
    id: wx72_clear_night
