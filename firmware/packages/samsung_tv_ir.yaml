switch:
# Sensor dock IR supply: RXD/GPIO44 drives the AO3401A P-channel gate.
# LOW enables IR_3V3 for both receiver and transmitter.
# Source: Espressif SCH_ESP32-S3-BOX-3-SENSOR-02_V1.1_20230808.pdf
  - platform: gpio
    id: ir_power
    internal: true
    pin:
      number: GPIO44
      inverted: true
    restore_mode: ALWAYS_ON
